# Example configuration file for tclock
# Use it explicitly with: tclock --config <path-to-this-file> [mode]
# (there is no default config path; --config is required to use a config file)

# Global default settings
[default]
# Default mode: clock, timer, stopwatch, countdown
mode = "clock"
# Default color
color = "green"
# Default size
size = 1

# Default settings for clock mode
[clock]
# Whether to show date
show_date = true
# Whether to show seconds
show_seconds = true
# Whether to show milliseconds
show_millis = false
# Timezone, e.g., "America/New_York", "Asia/Shanghai"
# timezone = "America/New_York"

# Default settings for timer mode
[timer]
# Default durations, can set multiple
durations = ["25m", "5m"]
# Corresponding titles, can set multiple
titles = ["Work", "Break"]
# Whether to repeat
repeat = false
# Whether to show milliseconds
show_millis = true
# Whether to start in paused state
start_paused = false
# Whether to auto quit after timer ends
auto_quit = false
# Commands to execute when timer ends
execute = []

# Default settings for stopwatch mode
[stopwatch]

# Default settings for countdown mode
[countdown]
# The target time to countdown to, eg. "2023-01-01", "20:00", "2022-12-25 20:00:00" or "2022-12-25T20:00:00-04:00"
# time = "2026-01-01"
# Title or description for countdown show in header
# title = "New year"
# Whether to show milliseconds
show_millis = false
# Whether to continue counting after reaching zero
continue_on_zero = false
# Whether to count in reverse (count up)
reverse = false
# Sort strategy for items: "time" (nearest first) or "config" (config file order)
# sort = "time"

# Multiple countdowns displayed simultaneously in a grid.
# Run `tclock countdown` (without --time) to show them.
# Grid layout: 1 -> fullscreen, 2-4 -> 2x2, 5-8 -> 4x2 (max 8 items).
[[countdown.items]]
time = "2027-01-01"
title = "New year 2027"
# Pin to a fixed grid position (1-based, row-major); optional
# order = 1

[[countdown.items]]
time = "2026-06-07 09:00:00"
title = "Exam"
# Per-item overrides (all optional):
# color = "red"
# size = 1
# show_millis = true
# reverse = false
